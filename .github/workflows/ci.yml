name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/household_finance?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/household_finance?schema=public"
  ADMIN_BOOTSTRAP_EMAIL: "ci@example.com"
  BASE_CURRENCY: "CHF"
  TRACKED_CURRENCIES: "CHF,BRL,USD,EUR"
  # Dummy auth + encryption secrets so `next build` and unit tests don't fail
  # at import time. Real secrets live in Vercel for production.
  AUTH_SECRET: "ci-only-dummy-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  AUTH_GOOGLE_ID: "ci-dummy-google-id"
  AUTH_GOOGLE_SECRET: "ci-dummy-google-secret"
  AUTH_TRUST_HOST: "true"
  FIELD_ENCRYPTION_KEY: "ci-only-dummy-field-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa="
  CRON_SHARED_SECRET: "ci-dummy-cron-secret"
  APP_BASE_URL: "http://localhost:3000"

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations (deploy)
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
